name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run application and bootstrap tests
        run: npm test
      - name: Run Firestore Security Rules tests in emulator
        run: npm run test:emulator
      - name: Test trusted Firebase Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm --prefix functions test
          npm --prefix functions run lint

      - name: Build production bundle
        run: npm run build
